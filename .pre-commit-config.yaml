# A TypeScript Obsidian plugin built with esbuild. It has no lint script, and
# `tsc --noEmit` currently fails (4 findings in src/setting.ts, src/test/,
# src/utils/title.ts), so typechecking is not a hook until the tree is clean.
# One-time setup per clone:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        # tsconfig.json carries comments, so only real JSON is validated.
        files: ^(package|manifest)\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        # main.js is the built bundle and is tracked (Obsidian loads it).
        args: ["--maxkb=2048"]
      - id: detect-private-key

  # The hook builds gitleaks with the Go toolchain on first run, so Go must be
  # on PATH; the built binary is cached afterwards. Only the staged diff is
  # scanned, and matches are redacted in the output.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
