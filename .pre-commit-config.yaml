# A TypeScript Obsidian plugin built with esbuild. It has no lint script, so
# the hook is `tsc --noEmit` directly; the build stays out because esbuild
# rewrites main.js and the repo tracks that bundle.
# One-time setup per clone:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        # tsconfig.json carries comments, so only real JSON is validated.
        files: ^(package|manifest)\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        # main.js is the built bundle and is tracked (Obsidian loads it).
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: npx tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # The hook builds gitleaks with the Go toolchain on first run, so Go must be
  # on PATH; the built binary is cached afterwards. Only the staged diff is
  # scanned, and matches are redacted in the output.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
